name: Flutter Windows Release Build

on:
  push:
    branches: [ main, master, develop, 006-fiscal-ticket-config ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: apps/pos_flutter
        run: flutter pub get

      - name: Build Windows Release
        working-directory: apps/pos_flutter
        run: flutter build windows --release

      - name: Create Windows ZIP archive
        working-directory: apps/pos_flutter/build/windows/x64/runner/Release
        run: |
          7z a -tzip ../../../../../pos_flutter_windows.zip *

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: pos_flutter_windows_release
          path: apps/pos_flutter/pos_flutter_windows.zip
          retention-days: 5

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-windows
          name: "Latest Windows Build"
          draft: false
          prerelease: true
          files: apps/pos_flutter/pos_flutter_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/232144991863/locations/global/workloadIdentityPools/github-actions/providers/github-provider'
          service_account: 'github-actions-pos-flutter@fresh-sensor-497515-d3.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to Cloud Storage Latest
        run: |
          gcloud storage cp apps/pos_flutter/pos_flutter_windows.zip gs://cacharelo-pos-releases/windows/pos_flutter_windows_latest.zip

      - name: Upload to Cloud Storage Versioned
        id: version
        run: |
          $appVersion = (Get-Content apps/pos_flutter/pubspec.yaml | Select-String '^version:' | ForEach-Object { $_ -replace 'version: ', '' -replace '\+.*', '' }).Trim()
          $date = Get-Date -Format "yyyyMMdd-HHmmss"
          $version = "v$appVersion-$date"
          gcloud storage cp apps/pos_flutter/pos_flutter_windows.zip gs://cacharelo-pos-releases/windows/pos_flutter_windows_$version.zip
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

          $size = (Get-Item apps/pos_flutter/pos_flutter_windows.zip).Length / 1MB
          $sizeFormatted = "{0:N1} MB" -f $size
          echo "SIZE=$sizeFormatted" >> $env:GITHUB_OUTPUT

      - name: Install jq for metadata generation
        run: choco install jq -y

      - name: Update version metadata
        working-directory: apps/pos_flutter
        run: |
          bash .github/scripts/generate-metadata.sh `
            "windows" `
            "${{ steps.version.outputs.VERSION }}" `
            "https://storage.googleapis.com/cacharelo-pos-releases/windows/pos_flutter_windows_latest.zip" `
            "${{ steps.version.outputs.SIZE }}" `
            "${{ github.sha }}" `
            "${{ github.ref_name }}"

      - name: Get build info
        id: build_info
        working-directory: apps/pos_flutter
        run: |
          $version = flutter --version | Select-String "Flutter" | Out-String
          echo "flutter_version=$version" >> $env:GITHUB_OUTPUT
          $date = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          echo "build_date=$date" >> $env:GITHUB_OUTPUT

      - name: Create build summary
        run: |
          echo "### 🎉 Windows Build Complete!" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "**Build Date:** $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" >> $env:GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $env:GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "📦 **Download the build artifact from the Actions tab**" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "The Windows release includes:" >> $env:GITHUB_STEP_SUMMARY
          echo "- pos_flutter.exe (main executable)" >> $env:GITHUB_STEP_SUMMARY
          echo "- All required DLL files" >> $env:GITHUB_STEP_SUMMARY
          echo "- Data folder with Flutter assets" >> $env:GITHUB_STEP_SUMMARY
