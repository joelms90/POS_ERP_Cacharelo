name: Flutter Web Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build-and-deploy-web:
    name: Build and Deploy Web App
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/232144991863/locations/global/workloadIdentityPools/github-actions/providers/github-provider'
          service_account: 'github-actions-pos-flutter@fresh-sensor-497515-d3.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: |
          # Use the authenticated gcloud credentials for Firebase
          gcloud config set project fresh-sensor-497515-d3
          firebase deploy --only hosting --project fresh-sensor-497515-d3 --non-interactive

      - name: Upload Web Build to Cloud Storage
        run: |
          DATE=$(date +"%Y%m%d-%H%M%S")
          VERSION="v1.0.0-$DATE"
          cd build/web
          tar -czf ../../pos_flutter_web_$VERSION.tar.gz *
          cd ../..
          gcloud storage cp pos_flutter_web_$VERSION.tar.gz gs://cacharelo-pos-releases/web/pos_flutter_web_$VERSION.tar.gz
          gcloud storage cp pos_flutter_web_$VERSION.tar.gz gs://cacharelo-pos-releases/web/pos_flutter_web_latest.tar.gz
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        id: version

      - name: Create deployment summary
        run: |
          echo "### 🎉 Flutter Web Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy Date:** $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Live URLs:**" >> $GITHUB_STEP_SUMMARY
          echo "- **Primary:** https://cacharelo-pos.web.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Custom Domain:** https://cafeteria.cacharelo.com (after DNS setup)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Build Archive:**" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.version.outputs.VERSION }}" ]; then
            echo "- **Latest:** https://storage.googleapis.com/cacharelo-pos-releases/web/pos_flutter_web_latest.tar.gz" >> $GITHUB_STEP_SUMMARY
            echo "- **Versioned:** https://storage.googleapis.com/cacharelo-pos-releases/web/pos_flutter_web_${{ steps.version.outputs.VERSION }}.tar.gz" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Web app is now live and accessible!**" >> $GITHUB_STEP_SUMMARY
