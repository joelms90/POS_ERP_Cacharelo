version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pos_postgres_local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pos_db
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_user -d pos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
